# SolarFlow ERP - Docker Compose Deployment
# Services: Odoo Community + PostgreSQL 15

services:
  web:
    image: odoo:18.0
    container_name: solarflow_odoo_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo_secure_pass_2026
    volumes:
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
      - solarflow-web-data:/var/lib/odoo
    command: -- --dev=reload,xml

  db:
    image: postgres:15-alpine
    container_name: solarflow_odoo_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo_secure_pass_2026
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - solarflow-db-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -u odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  solarflow-web-data:
    name: solarflow_web_data
  solarflow-db-data:
    name: solarflow_db_data
